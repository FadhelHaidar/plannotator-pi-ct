name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install workspace dependencies
        run: npm run install:dev

      - name: Build Pi extension and assets
        run: bun run build:pi

      - name: Typecheck Pi and shared UI
        run: |
          bun run typecheck:pi
          bunx tsc --noEmit -p packages/ui/tsconfig.json

      - name: Run non-DOM test suites
        run: >-
          bun test --timeout 15000
          apps/pi-extension packages/core packages/shared packages/ai
          packages/ui packages/editor packages/review-editor packages/guide-viewer

      - name: Test packaging and install bootstrap
        run: |
          bun test scripts/install-pi-source.test.ts
          node --test .github/scripts/bump-pi-version.test.mjs scripts/smoke-pi-package.test.mjs
          node scripts/pack-pi.mjs
          node scripts/smoke-pi-discovery.mjs artifacts/plannotator-pi-extension.tgz
